name: MovieNight
options:
  bundleIdPrefix: com.khush
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    # LGPL build of mpv + FFmpeg. Pinned exactly: binary xcframeworks, and tags carry FFmpeg suffixes.
    exactVersion: 1.1.0-n9.0.2
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MovieNight:
    type: application
    supportedDestinations: [macOS, iOS]
    sources: [MovieNight]
    dependencies:
      - package: MPVKit
        product: MPVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khush.movienight
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Movie Night
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": MovieNight/Resources/MovieNight-macOS.entitlements
        # Off for now: MPVKit's macOS build embeds LuaJIT, which the hardened runtime kills at
        # mpv_initialize. Needed again for notarized releases, with a Lua-free libmpv build.
        ENABLE_HARDENED_RUNTIME: NO
    scheme:
      testTargets: [MovieNightTests]
  MovieNightTests:
    type: bundle.unit-test
    supportedDestinations: [macOS, iOS]
    sources: [MovieNightTests]
    dependencies:
      - target: MovieNight
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/MovieNight.app/Contents/MacOS/MovieNight"
